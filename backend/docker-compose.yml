version: "3.8"

services:
  api:
    build: .
    container_name: minha-api-teste
    env_file:
      - .env
    environment:
      PORT: 3000
      REDIS_URL: redis://redis:6379
      DB_HOST: ${DB_HOST}
      DB_PORT: 5432
      DB_USER_NAME: ${DB_USER_NAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_DATABASE: ${DB_DATABASE}
      CHATWOOT_PLATFORM_TOKEN: ${CHATWOOT_PLATFORM_TOKEN}
      # Segredo que o CRM envia no header x-provisioning-token do
      # POST /api/webhooks/companies. Sem ele o endpoint recusa TODAS as
      # chamadas com 401 (falha fechada) e loga o motivo no boot da chamada.
      # Gere com: openssl rand -base64 32
      # Ver docs/integracao-crm-provisionamento.md
      PROVISIONING_TOKEN: ${PROVISIONING_TOKEN}
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "3000:3000"
  redis:
    image: redis:7-alpine
    container_name: project-charge-redis
    restart: unless-stopped
    command: >
      redis-server
      --appendonly yes
      --auto-aof-rewrite-percentage 100
      --auto-aof-rewrite-min-size 64mb
      --aof-rewrite-incremental-fsync yes
      --activedefrag yes
      --active-defrag-ignore-bytes 50mb
      --active-defrag-threshold-lower 10
      --active-defrag-threshold-upper 100
      --active-defrag-cycle-min 1
      --active-defrag-cycle-max 25
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --lazyfree-lazy-eviction yes
      --lazyfree-lazy-expire yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  redis_data:
  # postgres_data:
