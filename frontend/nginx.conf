server {
  listen 80;

  # HTML nunca deve ser cacheado — garante que o browser busque o build mais recente
  location ~* \.html$ {
    root /usr/share/nginx/html;
    add_header Cache-Control "no-store, no-cache, must-revalidate";
    try_files $uri /index.html;
  }

  # Assets com hash no nome (JS, CSS, fontes, imagens) podem ser cacheados por 1 ano
  location ~* \.(js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico|webp)$ {
    root /usr/share/nginx/html;
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  location / {
    root /usr/share/nginx/html;
    index index.html;
    try_files $uri /index.html;
  }
}
